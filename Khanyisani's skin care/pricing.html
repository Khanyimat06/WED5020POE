    <script src="javascript/java.js" defer></script>
    <title>Khanyisani's Skin Care | Pricing</title>

<body>
    <header>
        <h1>KHANYISANI'S SKIN CARE</h1>
        <img class="logo" src="/Users/mathebulakhanyisani/Desktop/images/logo.png" alt="Khanyisani's Skin Care logo">
        <nav class="nav-link" aria-label="main navigation">
            <ul>
                <li><a href="index.html">Homepage</a></li>
                <li><a href="services.html">Services</a></li>

            </ul>
        </nav>
    </header>

    <main>
        <h2>Pricing</h2>
        <p>Search, filter and sort our full range.</p>

        <div class="pricing-controls">
            <div>
                <label for="product-search">Search</label>
                <input type="search" id="product-search" placeholder="Search products…">
            </div>
            <div>
                <label for="product-filter">Type</label>
                <select id="product-filter">
                    <option value="all">All</option>
                    <option value="combo">Kits &amp; Bundles</option>
                    <option value="standalone">Individual Products</option>
                </select>
            </div>
            <div>
                <label for="product-sort">Sort</label>
                <select id="product-sort">
                    <option value="">Default</option>
                    <option value="price-asc">Price: low → high</option>
                    <option value="price-desc">Price: high → low</option>
                    <option value="name">Name A–Z</option>
                </select>
            </div>
        </div>

        <p id="product-count" aria-live="polite"></p>
        <div id="product-list" class="product-grid"></div>
    </main>

    <footer>
        <h4>GLOWTHEORY SA</h4>
        <p>&copy; 2026 Khanyisani's Skin Care - Bringing Light to your Skin. All Rights Reserved.</p>
    </footer>
